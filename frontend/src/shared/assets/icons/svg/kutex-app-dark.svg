<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#23272e" />
      <stop offset="100%" stop-color="#14161a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" stroke="#30363d" stroke-width="4" />
  
  <!-- Letter K (Vertical Bar) -->
  <line x1="184" y1="140" x2="184" y2="340" stroke="#f0f6fc" stroke-width="26" stroke-linecap="round" />
  
  <!-- Letter K (Top Diagonal) -->
  <line x1="184" y1="248" x2="294" y2="148" stroke="#f0f6fc" stroke-width="26" stroke-linecap="round" />
  
  <!-- Letter K (Bottom Diagonal) -->
  <line x1="192" y1="240" x2="298" y2="340" stroke="#f0f6fc" stroke-width="26" stroke-linecap="round" />
  
  <!-- Terminal Underscore Cursor -->
  <line x1="318" y1="340" x2="368" y2="340" stroke="#f0f6fc" stroke-width="26" stroke-linecap="round" />
  
  <!-- AI Sparkle / Star -->
  <path d="M 330 110 Q 330 145 365 145 Q 330 145 330 180 Q 330 145 295 145 Q 330 145 330 110 Z" fill="#4ef5d2" filter="url(#glow)" />
</svg>